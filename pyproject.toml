[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-anonymizer"
version = "0.2.0.dev0"
description = "Local document review, OCR and non-destructive text or raster PDF sanitization"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0", "presidio-analyzer==2.2.364", "spacy==3.8.16", "PyMuPDF==1.27.2.3", "Pillow==13.0.0", "defusedxml==0.7.1", "python-docx==1.2.0", "gliner==0.2.29", "torch==2.9.1", "transformers==4.57.6", "protobuf==7.36.2"]

[project.scripts]
local-anonymizer = "local_anonymizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
