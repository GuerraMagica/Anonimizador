[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-anonymizer"
version = "0.1.0.dev0"
description = "Local document review and non-destructive text sanitization"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0", "presidio-analyzer==2.2.364", "spacy==3.8.16"]

[project.scripts]
local-anonymizer = "local_anonymizer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
